name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
        env:
          PYTHONPATH: agents/shared:mcp/src:memory/api:evaluations
      - run: python evaluations/harness/runner.py
        env:
          PYTHONPATH: agents/shared:mcp/src:memory/api:evaluations
      - name: Deploy to staging
        run: echo "Deploy MCP + agents to staging (configure AWS/Terraform)"
